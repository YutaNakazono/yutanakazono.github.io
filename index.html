<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Meet</title>
    <script src="https://meet.jit.si/external_api.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; transition: 0.3s; }
        #meet-container { width: 100%; height: 100%; display: none; }
        .btn { background: #4285f4; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-size: 16px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn:active { transform: scale(0.98); }
        input { padding: 12px; border-radius: 8px; border: none; margin-bottom: 20px; width: 250px; text-align: center; font-size: 16px; }
    </style>
</head>
<body>

    <div id="setup">
        <h2 id="status">Welcome</h2>
        <input type="text" id="username" placeholder="あなたの名前を入力" value="">
        <button class="btn" onclick="startMeeting()">会議を開始する</button>
        <p style="font-size: 12px; margin-top: 20px; color: #888;">※カメラ・マイクの許可が必要です</p>
    </div>

    <div id="meet-container"></div>

    <script>
        // スマホでもスムーズに起動するための設定
        function startMeeting() {
            const name = document.getElementById('username').value || "ゲスト";
            
            // 画面表示の切り替え
            document.getElementById('setup').style.display = 'none';
            document.getElementById('meet-container').style.display = 'block';

            // URLからルーム名を取得。なければ共通の固定名（またはランダム）
            const urlParams = new URLSearchParams(window.location.search);
            const roomName = urlParams.get('room') || "SuperGlobalRoom2025";

            const domain = "meet.jit.si";
            const options = {
                roomName: roomName,
                width: "100%",
                height: "100%",
                parentNode: document.querySelector('#meet-container'),
                userInfo: { displayName: name },
                configOverwrite: {
                    prejoinPageEnabled: false, // 準備画面をスキップ（最速入室）
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    disableDeepLinking: false  // スマホアプリがある場合はアプリで開く
                },
                interfaceConfigOverwrite: {
                    MOBILE_APP_PROMO: false,
                    TOOLBAR_BUTTONS: ['microphone', 'camera', 'chat', 'tileview', 'hangup']
                }
            };
            
            // Jitsi起動
            const api = new JitsiMeetExternalAPI(domain, options);
        }

        // URLにroomパラメータがない場合、自動で付与してリロード（URL共有を簡単にするため）
        if (!window.location.search.includes('room=')) {
            const randomRoom = "Meeting-" + Math.random().toString(36).substring(7);
            window.history.replaceState(null, '', `?room=${randomRoom}`);
        }
    </script>
</body>
</html>
