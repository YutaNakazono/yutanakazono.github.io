<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Simple Meet</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://meet.jit.si/external_api.js"></script>
    <style>
        body, html { margin: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #container { width: 100%; height: 100%; display: none; }
        .login-box { text-align: center; }
        h2 { font-weight: 300; margin-bottom: 2rem; }
    </style>
</head>
<body>

    <div id="login-ui" class="login-box">
        <h2>Simple Meet</h2>
        <div id="g_id_onload"
             data-client_id="977150616140-667hpgghfnhv6v9g80qf876p9vsq27h7.apps.googleusercontent.com"
             data-callback="onSignIn"
             data-auto_prompt="true">
        </div>
        <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_blue"></div>
    </div>

    <div id="container"></div>

    <script>
        // Googleログイン成功後の処理
        function onSignIn(response) {
            const data = JSON.parse(atob(response.credential.split('.')[1])); // ユーザー情報を展開
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('container').style.display = 'block';

            // 会議の起動
            const roomName = new URLSearchParams(window.location.search).get('room') || "Room-" + Math.random().toString(36).substring(7);
            const api = new JitsiMeetExternalAPI("meet.jit.si", {
                roomName: roomName,
                parentNode: document.querySelector('#container'),
                userInfo: { displayName: data.name, email: data.email },
                configOverwrite: { 
                    prejoinPageEnabled: false, // 即座に参加
                    startWithAudioMuted: false, 
                    startWithVideoMuted: false 
                }
            });
        }
    </script>
</body>
</html>
