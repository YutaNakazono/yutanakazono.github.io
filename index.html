<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Meet - No Error</title>
    <script src="https://meet.jit.si/external_api.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; overflow: hidden; }
        #meet { width: 100vw; height: 100vh; }
        /* 起動前のロード画面 */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a73e8; color: white; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            font-family: sans-serif; z-index: 100;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div>会議室を生成中...</div>
    </div>

    <div id="meet"></div>

    <script>
        window.onload = () => {
            // 1. ルーム名の決定（URLにroomがあれば使用、なければランダム生成）
            const params = new URLSearchParams(window.location.search);
            let room = params.get('room');
            if (!room) {
                room = "Meeting-" + Math.random().toString(36).substring(7);
                window.history.replaceState(null, '', `?room=${room}`);
            }

            // 2. Jitsi Meetの起動（エラーの原因となる個別Client IDを使用しない設定）
            const domain = "meet.jit.si";
            const options = {
                roomName: room,
                parentNode: document.querySelector('#meet'),
                lang: 'ja',
                configOverwrite: {
                    prejoinPageEnabled: true, // ここでユーザーがGoogle等の情報を自由に設定可能
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    disableThirdPartyRequests: false // 外部認証を許可
                },
                interfaceConfigOverwrite: {
                    MOBILE_APP_PROMO: false, // スマホブラウザでそのまま動かす
                    SHOW_CHROME_EXTENSION_BANNER: false
                }
            };

            const api = new JitsiMeetExternalAPI(domain, options);

            // 読み込み完了後にローディング画面を消去
            api.addEventListener('videoConferenceJoined', () => {
                document.getElementById('loading').style.display = 'none';
            });
            
            // 5秒経過しても消えない場合は強制的に消す（保険）
            setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 5000);
        };
    </script>
</body>
</html>
