<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NextGen Meet - Google Auth</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://meet.jit.si/external_api.js"></script>
    
    <style>
        :root { --primary: #4285f4; --bg: #1a1a1a; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); font-family: 'Roboto', sans-serif; overflow: hidden; }
        
        /* ログイン画面のスタイル */
        #auth-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; color: white; transition: opacity 0.5s ease;
        }
        .logo { width: 80px; height: 80px; margin-bottom: 20px; }
        h1 { font-weight: 300; margin-bottom: 30px; }

        /* 会議画面（初期は非表示） */
        #meet-container { width: 100%; height: 100%; display: none; }
        
        /* スマホ向け調整 */
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div id="auth-container">
        <svg class="logo" viewBox="0 0 24 24"><path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        <h1>Googleアカウントで参加</h1>
        <div id="buttonDiv"></div>
    </div>

    <div id="meet-container"></div>

    <script>
        const CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"; // ←ここにGoogle Consoleで発行したIDを入れます

        // 1. Google 認証の初期化
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { theme: "outline", size: "large", width: 250, shape: "pill" }
            );
        }

        // 2. 認証成功時の処理
        function handleCredentialResponse(response) {
            // 本来はここでサーバー側にJWTを送り検証しますが、フロントでのデモとしてデコード
            const responsePayload = parseJwt(response.credential);
            
            console.log("Authenticated: " + responsePayload.name);
            
            // 画面の切り替え
            document.getElementById('auth-container').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('meet-container').style.display = 'block';
                initMeeting(responsePayload.name, responsePayload.email);
            }, 500);
        }

        // 3. 会議の起動（スマホ最適化）
        function initMeeting(displayName, email) {
            const urlParams = new URLSearchParams(window.location.search);
            const roomName = urlParams.get('room') || "Super-Smart-Meeting-" + Math.random().toString(36).substring(7);

            const domain = "meet.jit.si";
            const options = {
                roomName: roomName,
                width: "100%",
                height: "100%",
                parentNode: document.querySelector('#meet-container'),
                userInfo: {
                    email: email,
                    displayName: displayName
                },
                configOverwrite: {
                    prejoinPageEnabled: false, // スマホで即座に参加できるよう準備画面をスキップ
                    disableDeepLinking: false,  // スマホアプリ（Jitsi）への誘導を有効化
                    startWithAudioMuted: false,
                    startWithVideoMuted: false
                },
                interfaceConfigOverwrite: {
                    MOBILE_APP_PROMO: false, // 広告を消す
                    TOOLBAR_BUTTONS: ['microphone', 'camera', 'chat', 'tileview', 'hangup', 'videoquality']
                }
            };
            const api = new JitsiMeetExternalAPI(domain, options);
        }

        // JWTデコード用関数
        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>
</body>
</html>
